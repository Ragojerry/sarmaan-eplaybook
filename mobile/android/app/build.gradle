plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "org.malariaconsortium.sarmaan_eplaybook"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // See docs/architecture.md §6 — platform target is confirmed
        // Android + iOS. This is the Android half.
        applicationId "org.malariaconsortium.sarmaan_eplaybook"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO(Phase 9+): replace with a real release signing config
            // before shipping. Debug signing is fine for local dev builds.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
