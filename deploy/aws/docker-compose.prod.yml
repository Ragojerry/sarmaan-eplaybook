# Production stack for the single EC2 host (see deploy/aws/README.md).
# Lives at /opt/sarmaan/deploy/aws on the instance; paths are relative to it.
# Secrets come from /opt/sarmaan/.env.prod, which bootstrap.sh generates on the
# instance and which never leaves it.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarmaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: sarmaan_eplaybook
    # No published port: only the backend container can reach Postgres.
    volumes:
      - db_data:/var/lib/postgresql/data
      - /opt/sarmaan/restore:/restore:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarmaan -d sarmaan_eplaybook"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - /opt/sarmaan/.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://sarmaan:${POSTGRES_PASSWORD}@db:5432/sarmaan_eplaybook
    # Same image as development, minus --reload; migrations run first and are a
    # no-op once the schema is current.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
             --proxy-headers --forwarded-allow-ips='*'"
    ports:
      # Port 80 is reachable only from CloudFront (security group rule).
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # media.py resolves ../content/media against /app -> /content/media;
      # release packages are written to /content/releases.
      - ../../content:/content

volumes:
  db_data:
